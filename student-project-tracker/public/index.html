<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Project Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Student Project Tracker</h1>
      <p>Track our electronics project ideas.</p>
    </header>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Add a Project</h2>

      <form id="project-form">
        <div>
          <label for="name">Project Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            maxlength="80"
          >
        </div>

        <div>
          <label for="status">Project Status</label>
          <select id="status" name="status">
            <option value="Planned">Planned</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <button id="save-button" type="submit">Save Project</button>
        <button id="cancel-button" type="button" hidden>Cancel</button>
      </form>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Your Projects</h2>

      <div class="list-tools" hidden>
        <div>
          <label for="search">Search</label>
          <input type="search" id="search" placeholder="Search by name" autocomplete="off">
        </div>

        <div>
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">Name A–Z</option>
            <option value="status">Status</option>
          </select>
        </div>
      </div>

      <div id="filters" class="filters" role="group" aria-label="Filter by status" hidden>
        <button type="button" data-filter="All" aria-pressed="true">All</button>
        <button type="button" data-filter="Planned" aria-pressed="false">Planned</button>
        <button type="button" data-filter="In Progress" aria-pressed="false">In Progress</button>
        <button type="button" data-filter="Completed" aria-pressed="false">Completed</button>
      </div>

      <p id="list-summary" class="list-summary" aria-live="polite"></p>
      <p id="empty-state">No projects yet.</p>
      <ul id="project-list"></ul>
    </section>
  </main>
</body>
</html>
